name: FilmSim
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    # 注意：这里必须是「语言版本号」(5.0 / 6.0)，不是 Swift 编译器版本(5.9)。
    # 写成 5.9 会让 xcodebuild 直接报 "SWIFT_VERSION '5.9' is unsupported"。
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  FilmSim:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FilmSim
        excludes:
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
      - path: FilmSim/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.filmsim
        PRODUCT_NAME: FilmSim
        INFOPLIST_FILE: FilmSim/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  FilmSim:
    build:
      targets:
        FilmSim: all
    run:
      config: Debug
    archive:
      config: Release
